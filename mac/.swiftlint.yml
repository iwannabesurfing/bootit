# SwiftLint configuration for BootIt.
# Run with `swiftlint lint --strict` (CI does this) so every warning is an error.

included:
  - Sources

excluded:
  - .build
  - dist
  - vendor

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping            # the review's headline issue — enforced from now on
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 220
  ignores_comments: true
  ignores_urls: true

# Short, idiomatic names are fine in tight scopes (p, r, fm, ns…).
identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
    error: 60

function_body_length:
  warning: 90
  error: 130

type_body_length:
  warning: 400
  error: 550

file_length:
  warning: 700
  error: 900
