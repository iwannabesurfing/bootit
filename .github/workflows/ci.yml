name: CI

# A macOS runner bills at roughly 10x a Linux one, and this job cannot move off
# macOS: it is a SwiftPM app for Apple Silicon, so the build, the tests and
# SwiftLint all need the Apple toolchain. The lever that is actually available
# is not running it when nothing it checks has changed — roughly a third of the
# commits here are session-log or README edits, and each one was spinning a full
# macOS build.
#
# Not gated on `github.ref` or to release events: that would leave the default
# branch's only build/test/lint signal firing after the fact, which is worth far
# more than the runner minutes it would save. If branch protection is ever added,
# note that a docs-only PR will have no CI run to satisfy a required check.
on:
  # Spelled out twice on purpose: GitHub's workflow parser does not resolve YAML
  # anchors, so a `&docs` / `*docs` pair that validates locally fails on push.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, test & lint
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      # `-warnings-as-errors` because "0 compiler warnings" has been an unbacked
      # claim in this repo twice. Once the session log asserted it while citing a
      # receipt that contained `result of 'try?' is unused` — present the whole
      # time, in the file the same session was editing. A warning nobody is
      # obliged to look at is a warning nobody looks at.
      #
      # Verified in both directions on 2026-08-04 before being trusted, the same
      # way the sanitizer below was: an `let unused = 1` planted in RunPlan.swift
      # makes this exit 1 naming the file and line, while a plain `swift build`
      # on the identical tree prints ten warnings and still reports "Build
      # complete" with exit 0 — which is the silent-success shape a release
      # workflow in this repo has already shipped once.
      - name: Build (debug, warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # The flag is repeated rather than set once: the test target compiles
      # separately, and a warning in a test is how a racing or dead assertion
      # gets written without anybody noticing.
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      # Three threading bugs have shipped in the copy-progress subsystem alone: a
      # cancel dispatched onto the queue it was meant to interrupt, a poller
      # holding a global-pool thread for forty minutes, and a reducer mutated from
      # the XPC delivery thread and `worker` at once. The third was found only
      # because a sanitizer was run by hand — nothing obliged anyone to.
      #
      # In the same job rather than its own: a second `runs-on: macos-15` would
      # bill a whole extra runner at 10x, where this reuses the checked-out tree
      # and costs one more instrumented build. It is deliberately not
      # `continue-on-error` — an advisory sanitizer is the same silent-success
      # shape that let a release publish nothing and report green.
      #
      # Verified in both directions on 2026-08-04, not assumed: restoring the
      # unsynchronised `AppModel.ingest` makes this exit 1 with 8 race warnings,
      # and the fixed tree exits 0 with none. TSan's own default exit code is
      # what fails the step, so no TSAN_OPTIONS are set here.
      - name: Test (ThreadSanitizer)
        run: swift test --sanitize=thread

      # The harness that certifies every "this test bites" claim in this repo.
      # Only the self-test runs here, not the corpus: eight mutations is eight
      # builds plus eight filtered test runs on a runner billing at 10x, and the
      # corpus is the thing you run deliberately when tests change. The self-test
      # is two builds and one test run, and it guards the property that makes
      # every corpus result meaningful.
      #
      # It checks both directions, because both failures are silent. A harness
      # that reports SURVIVES for a patch that never applied sends you off to
      # write a test that already exists; a harness that can only report BITES
      # certifies untested code as tested and has no symptom at all.
      - name: Mutation harness self-test
        working-directory: .
        run: ./bin/mutation-check.py --self-test

      - name: SwiftLint (strict)
        run: |
          brew install swiftlint
          swiftlint lint --strict
